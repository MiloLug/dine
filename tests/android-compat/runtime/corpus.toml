# Runtime test corpus: AOSP ART run-tests (art/test/NNN-name), plus our own under authored/.
# Read by harness/; see README.md.

[upstream]
# Must match the ART that dine-art (our art_standalone fork) is rebased on
# (dine-art commit f9aedbf5 "rebase art on android-security-10.0.0_r75").
# Bump together with an ART rebase, then rebaseline expectations.
repo = "https://android.googlesource.com/platform/art"
tag = "android-security-10.0.0_r75"
commit = "1a4ad14546552d44c2239f0855021d8a20989db8"   # peeled tag

[tools]
# d8 from AUR android-sdk-build-tools needs Java 11+; JDK 8 stays the default for the ATL build.
d8 = "/opt/android-sdk/build-tools/37.0.0/d8"
d8_java_home = "/usr/lib/jvm/java-21-openjdk"

[run]
# Upstream run-test-jar's host interpreter flags (no dex2oat prebuild: dex runs directly).
vm_args = ["-Xjnigreflimit:512", "-Xcheck:jni", "-Xint", "-Xusejit:false", "-Xnorelocate",
           "-XX:DumpNativeStackOnSigQuit:false"]
# Upstream uses "*:s" without a boot image. "*:f" also hides the boot-image warnings but keeps
# fatal messages, which only appear when a test is failing anyway.
log_tags = "*:f"
timeout = 120   # seconds per test

[timeouts]
# Per-test overrides, seconds. Example: "080-oom-throw" = 300
